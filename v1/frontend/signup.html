<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOGINX — Sign Up</title>
  <link rel="stylesheet" href="/ui/css/style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <main class="auth-page">
    <section class="auth-shell">
      <div class="auth-brand">
        <div class="logo"><span class="logo-icon">🛡</span> NOGINX</div>
        <h1>Build your security workspace</h1>
        <p>Create an account to upload log files, run AI threat scans, and track incidents from a unified dashboard.</p>
      </div>
      <div class="auth-panel">
        <h2>Create account</h2>
        <p class="muted">Start monitoring suspicious web traffic</p>
        <div id="alert" class="alert"></div>
        <form id="signupForm" class="form">
          <label>Username
            <input id="username" type="text" autocomplete="username" required minlength="3" />
          </label>
          <label>Email
            <input id="email" type="email" autocomplete="email" required />
          </label>
          <label>Password
            <input id="password" type="password" autocomplete="new-password" required minlength="6" />
          </label>
          <button class="btn btn-primary" type="submit">Create Account</button>
        </form>
        <p class="auth-footer">Already registered? <a href="/ui/login.html">Sign in</a></p>
      </div>
    </section>
  </main>
  <script src="/ui/js/api.js"></script>
  <script src="/ui/js/auth.js"></script>
</body>
</html>
